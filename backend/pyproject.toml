[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-video-studio-backend"
version = "0.1.0"
description = "Local-first multi-agent video production orchestration"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "langgraph>=0.2,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.scripts]
uvs-agent = "backend.app.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]
